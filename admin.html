<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>預約後台</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;600&display=swap" rel="stylesheet">
<style>
/* ===== ITSNONO_STUDIO 品牌視覺統一 ===== */
:root {
  --bg: #FAF8F4;
  --card: #FFFFFF;
  --pill: #F5F1EB;
  --ink: #51433C;
  --mute: #8B7C73;
  --line: #E0D3C8;
  --warn: #A9825F;
  --ok: #75856A;
  --bad: #B66B5E;

  --serif: "Noto Serif TC", "Songti TC",
           "PMingLiU", serif;
}

/* 整體背景與字體 */
body {
  background: var(--bg);
  color: var(--ink);
  font-family:
    "PingFang TC",
    "Noto Sans TC",
    "Microsoft JhengHei",
    sans-serif;
  font-weight: 400;
  letter-spacing: 0.02em;
  line-height: 1.7;
  -webkit-font-smoothing: antialiased;
}

/* 主要頁面 */
main {
  max-width: 560px;
  margin: 0 auto;
  padding: 24px 16px 110px;
}

/* 品牌標題區 */
.top {
  border-bottom: 1px solid var(--line);
  margin-bottom: 24px;
  padding-bottom: 18px;
}

.logo {
  color: #6B5548;
  font-family: var(--serif);
  font-size: 19px;
  font-weight: 600;
  letter-spacing: 0.2em;
}

.logo small {
  color: var(--mute);
  letter-spacing: 0.12em;
}

/* 頁面標題 */
h1 {
  color: #59473E;
  font-family: var(--serif);
  font-size: 28px;
  font-weight: 700;
  letter-spacing: 0.06em;
  line-height: 1.4;
}

.sub {
  color: var(--mute);
  line-height: 1.8;
}

/* 卡片 */
.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 22px;
  padding: 20px;
  margin-bottom: 16px;
  box-shadow: 0 4px 20px rgba(92, 69, 53, 0.035);
}

/* 按鈕 */
.b {
  background: #6B5548;
  color: #FFFFFF;
  border: 1px solid #6B5548;
  border-radius: 12px;
  padding: 11px 18px;
  font-family: inherit;
  font-weight: 500;
  letter-spacing: 0.03em;
  transition: background 0.2s ease;
}

.b.g {
  background: #FFFFFF;
  color: #6B5548;
  border-color: var(--line);
}

.b.d {
  background: transparent;
  color: var(--bad);
  border-color: #D9B8AE;
}

/* 分類膠囊按鈕 */
.pill {
  background: #F4EFE8;
  color: #6B5548;
  border: 1px solid transparent;
  border-radius: 999px;
  box-shadow: none;
  padding: 10px 18px;
}

.pill.on {
  background: #6B5548;
  color: #FFFFFF;
}

/* 表單欄位 */
input,
select,
textarea {
  background: #FFFFFF;
  color: var(--ink);
  border: 1px solid #DCCBC0;
  border-radius: 12px;
  font-family: inherit;
  font-size: 15px;
  padding: 12px 14px;
  outline: none;
  max-width: 100%;
}

input:focus,
select:focus,
textarea:focus {
  border-color: #A58A76;
  box-shadow: 0 0 0 3px rgba(165, 138, 118, 0.12);
}

/* 日期與預約列表 */
.bk {
  border-bottom: 1px solid #EAE2DA;
  padding: 15px 0;
}

.dh {
  color: #6B5548;
  font-family: var(--serif);
  font-weight: 700;
  margin: 18px 0 6px;
}

.dh.now {
  color: #A9825F;
}

/* 日期、時間選項 */
.chip {
  background: #FFFFFF;
  color: #6B5548;
  border: 1px solid var(--line);
  border-radius: 999px;
}

.chip.on {
  background: #6B5548;
  color: #FFFFFF;
  border-color: #6B5548;
}

/* 狀態標籤 */
.tag {
  border-radius: 999px;
  padding: 3px 10px;
  font-size: 12px;
  font-weight: 500;
}

/* 底部固定操作列 */
.bar {
  background: rgba(255, 255, 255, 0.97);
  border-top: 1px solid var(--line);
  backdrop-filter: blur(12px);
}

/* 手機版細節 */
@media (max-width: 480px) {
  main {
    padding: 20px 14px 100px;
  }

  h1 {
    font-size: 26px;
  }

  .card {
    padding: 17px;
    border-radius: 20px;
  }

  .logo {
    font-size: 17px;
  }
}
</style>
</head>
<body>
<main>
<div id="login" style="padding-top:40px">
  <div class="logo">ITSNONO<small>預約後台</small></div>
  <div class="card" style="margin-top:28px">
    <p class="mute" style="margin-top:0">輸入後台密碼</p>
    <div class="row"><input id="pw" type="password" class="w" autocomplete="current-password"><button class="b" id="go">登入</button></div>
  </div>
</div>

<div id="app" hidden>
  <div class="top"><div class="logo">ITSNONO<small>預約後台</small></div><button class="b g sm" id="out">登出</button></div>
  <h1 id="title"></h1><p class="sub" id="subt"></p>
  <div class="pills" id="tabs">
    <button class="pill on" data-t="bookings">預約系統</button><button class="pill" data-t="hours">營業時間</button><button class="pill" data-t="services">服務項目</button><button class="pill" data-t="members">會員資料</button>
  </div>

  <section id="p-bookings">
    <div class="row sp">
      <div class="row" id="modes"><button class="pill s on" data-m="day">日</button><button class="pill s" data-m="week">週</button><button class="pill s" data-m="month">月</button></div>
      <select id="bf"><option value="all">全部狀態</option><option>待確認</option><option>已預約</option><option>已取消</option></select>
    </div>
    <div class="nav"><button class="r" id="bp" aria-label="上一個">‹</button><div class="row"><b id="blabel"></b><button class="b g sm" id="bt">今天</button></div><button class="r" id="bn" aria-label="下一個">›</button></div>
    <div class="card" id="bview"></div>
  </section>

  <section id="p-hours" hidden>
    <div class="card">
      <div class="nav" style="margin-top:0"><button class="r" id="hp" aria-label="上個月">‹</button><b id="hlabel"></b><button class="r" id="hn" aria-label="下個月">›</button></div>
      <div id="hgrid"></div>
      <div class="row" id="hsel" style="margin-top:12px"><span class="mute">快速選取</span><button class="pill s" data-s="wk">平日</button><button class="pill s" data-s="we">週末</button><button class="pill s" data-s="all">整月</button><button class="pill s" data-s="clear">清除</button></div>
      <p class="mute" style="margin:10px 0 0">格子上的數字是當天時段數，「休」是休息，底線是尚未儲存。</p>
    </div>
    <div class="card" id="hed" hidden>
      <b id="hcount"></b>
      <div class="chips" id="hchips"></div>
      <div class="row"><input type="time" id="hT"><button class="b g sm" id="hAdd">加入新時段</button></div>
      <div class="row" style="margin-top:14px"><button class="b" id="hApply">套用到所選日期</button><button class="b g" id="hOff">設為休息</button></div>
    </div>
  </section>

  <section id="p-services" hidden>
    <div class="row" style="margin-bottom:10px" id="sf"><button class="pill s on" data-f="all">全部</button><button class="pill s" data-f="on">啟用中</button><button class="pill s" data-f="off">已停用</button><span style="flex:1"></span><button class="b sm" id="sAdd">新增服務</button></div>
    <div id="slist"></div>
  </section>

  <section id="p-members" hidden>
    <input id="mq" style="width:100%;margin-bottom:12px" placeholder="搜尋姓名或電話">
    <div id="mlist"></div>
  </section>

  <div class="bar" id="bar" hidden><button class="b" id="save"></button></div>
</div>
<div id="toast" hidden></div>
</main>

<script>
const GAS_URL = "https://script.google.com/macros/s/AKfycbwkeaCm6K0-ZaRutf4aPVNF3H72tohOjYaIKB5fkEx3OM1hbb6BKiB5ATallGeXCSLR/exec";
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const WN = "日一二三四五六";
const D = s => new Date(s + "T00:00:00Z"), fmt = d => d.toISOString().slice(0,10);
const add = (s,n) => { const d = D(s); d.setUTCDate(d.getUTCDate()+n); return fmt(d); };
const wd = s => D(s).getUTCDay();
const today = () => new Date().toLocaleDateString("sv-SE", {timeZone:"Asia/Taipei"});
const short = s => `${+s.slice(5,7)}/${+s.slice(8)}`;
const md = s => `${short(s)}（${WN[wd(s)]}）`;
const mStart = s => s.slice(0,8) + "01";
const addMonth = (s,n) => { const d = D(mStart(s)); d.setUTCMonth(d.getUTCMonth()+n); return fmt(d); };
const mDays = ms => new Date(Date.UTC(+ms.slice(0,4), +ms.slice(5,7), 0)).getUTCDate();
const dayOf = (ms,d) => ms.slice(0,8) + String(d).padStart(2,"0");
const fixPhone = p => /^9\d{8}$/.test(p) ? "0"+p : p;
const mLabel = ms => `${ms.slice(0,4)} 年 ${+ms.slice(5,7)} 月`;

let pw = ""; try { pw = sessionStorage.getItem("pw") || ""; } catch(e) {}
let S = {hours:[], services:[], bookings:[], members:[]};
let svc = [], dirty = new Map(), tab = "bookings", tt;
const TITLES = {
  bookings:["預約系統","所有預約都在這裡，可切換日、週、月檢視。"],
  hours:["營業時間","點選日期，挑好時段，一次套用到多天。"],
  services:["服務項目","調整價格與時長；不再提供的服務可以停用或刪除。"],
  members:["會員資料","客戶的聯絡方式，以及你自己的備註。"]
};

function toast(m){ const t=$("toast"); t.textContent=m; t.hidden=false; clearTimeout(tt); tt=setTimeout(()=>t.hidden=true,2800); }
async function api(action, data = {}) {
  if (GAS_URL.indexOf("http") !== 0) throw new Error("請先在 admin.html 設定 GAS_URL");
  const res = await fetch(GAS_URL, {method:"POST", body: JSON.stringify({pw, action, ...data})});
  const j = await res.json();
  if (!j.ok) throw new Error(j.error || "發生錯誤");
  return j;
}
async function load(){ S = await api("getAll"); svc = S.services.map(s => ({...s})); renderAll(); }
async function login(){
  pw = $("pw").value || pw;
  try {
    await api("login");
    try { sessionStorage.setItem("pw", pw); } catch(e) {}
    await load(); $("login").hidden = true; $("app").hidden = false; setTab("bookings");
  } catch(e) { pw = ""; toast(e.message); }
}
$("go").onclick = login;
$("pw").onkeydown = e => { if (e.key === "Enter") login(); };
$("out").onclick = () => { try { sessionStorage.removeItem("pw"); } catch(e) {} location.reload(); };
if (pw) login();

function setTab(t){
  tab = t;
  document.querySelectorAll("#tabs .pill").forEach(x => x.classList.toggle("on", x.dataset.t === t));
  ["bookings","hours","services","members"].forEach(k => $("p-"+k).hidden = k !== t);
  $("title").textContent = TITLES[t][0]; $("subt").textContent = TITLES[t][1];
  updBar();
}
$("tabs").onclick = e => { const b = e.target.closest("button[data-t]"); if (b) setTab(b.dataset.t); };

/* ================= 預約：日／週／月 ================= */
const V = {mode:"day", cur:today(), sel:today()};
function bkByDate(){
  const f = $("bf").value, m = {};
  S.bookings.forEach(b => { if (f !== "all" && b["狀態"] !== f) return; (m[b["日期"]] = m[b["日期"]] || []).push(b); });
  for (const k in m) m[k].sort((a,b) => a["時間"].localeCompare(b["時間"]));
  return m;
}
function bkCard(b){
  const st = b["狀態"], id = esc(b["預約編號"]);
  return `<div class="bk ${st==="已取消"?"x":""}">
    <div class="row sp"><b>${esc(b["時間"])}　${esc(b["服務"])}</b><span class="tag t-${esc(st)}">${esc(st)}</span></div>
    <div>${esc(b["姓名"])}・<a href="tel:${esc(fixPhone(b["電話"]))}">${esc(fixPhone(b["電話"]))}</a></div>
    <div class="mute">$${esc(b["價格"])}${b["訂金後五碼"] ? "　後五碼 "+esc(b["訂金後五碼"]) : ""}${b["備註"] ? "　備註：" + esc(b["備註"]) : ""}</div>
    <div class="row" style="margin-top:8px">
      <button class="b sm" data-act="ok" data-id="${id}" ${st==="已預約"?"disabled":""}>確認</button>
      <button class="b sm d" data-act="no" data-id="${id}" ${st==="已取消"?"disabled":""}>取消</button>
    </div></div>`;
}
const bkList = a => a && a.length ? a.map(bkCard).join("") : '<p class="mute none">這天沒有預約。</p>';
function renderBookings(){
  const m = bkByDate(), t = today(); let html = "", label = "";
  if (V.mode === "day") { label = md(V.cur); html = bkList(m[V.cur]); }
  else if (V.mode === "week") {
    const s = add(V.cur, -wd(V.cur)); label = `${short(s)} – ${short(add(s,6))}`;
    for (let i = 0; i < 7; i++) {
      const ds = add(s,i), a = m[ds];
      html += `<div class="dh ${ds===t?"now":""}" style="${i?"":"margin-top:0"}">${md(ds)}<span class="mute">${a ? a.length+" 筆" : ""}</span></div>` + (a ? a.map(bkCard).join("") : '<div class="mute none">—</div>');
    }
  } else {
    const ms = mStart(V.cur); label = mLabel(ms);
    let g = WN.split("").map(c => `<div class="wh">${c}</div>`).join("") + "<div></div>".repeat(wd(ms));
    for (let d = 1; d <= mDays(ms); d++) {
      const ds = dayOf(ms,d), a = (m[ds] || []).filter(x => x["狀態"] !== "已取消"), p = a.some(x => x["狀態"] === "待確認");
      g += `<button class="c ${ds===t?"today":""} ${ds===V.sel?"sel":""}" data-day="${ds}"><b>${d}</b><i class="${a.length?"n":""} ${p?"p":""}">${a.length||""}</i></button>`;
    }
    html = `<div class="grid">${g}</div><div class="dh">${md(V.sel)}</div>${bkList(m[V.sel])}`;
  }
  $("blabel").textContent = label; $("bview").innerHTML = html;
}
function shift(n){
  if (V.mode === "day") V.cur = add(V.cur, n);
  else if (V.mode === "week") V.cur = add(V.cur, 7*n);
  else { V.cur = addMonth(V.cur, n); V.sel = V.cur.slice(0,7) === today().slice(0,7) ? today() : V.cur; }
  renderBookings();
}
$("bp").onclick = () => shift(-1); $("bn").onclick = () => shift(1);
$("bt").onclick = () => { V.cur = V.sel = today(); renderBookings(); };
$("bf").onchange = renderBookings;
$("modes").onclick = e => {
  const b = e.target.closest("button[data-m]"); if (!b) return;
  if (b.dataset.m === "month") V.sel = V.cur; else if (V.mode === "month") V.cur = V.sel;
  V.mode = b.dataset.m;
  document.querySelectorAll("#modes .pill").forEach(x => x.classList.toggle("on", x === b));
  renderBookings();
};
$("bview").onclick = async e => {
  const c = e.target.closest("button[data-day]");
  if (c) { V.sel = c.dataset.day; return renderBookings(); }
  const b = e.target.closest("button[data-act]"); if (!b) return;
  const ok = b.dataset.act === "ok", id = b.dataset.id;
  const bk = S.bookings.find(x => String(x["預約編號"]) === id);
  if (!ok && !confirm(`確定取消 ${bk["姓名"]} ${bk["日期"]} ${bk["時間"]} 的預約？`)) return;
  b.disabled = true;
  try {
    const status = ok ? "已預約" : "已取消";
    await api("setStatus", {id, status}); bk["狀態"] = status; renderBookings(); toast(ok ? "已確認" : "已取消");
  } catch(err) { toast(err.message); b.disabled = false; }
};

/* ================= 營業時間：選日期＋選時段 ================= */
const H = {ms:mStart(today()), sel:new Set(), pick:new Set(), extra:new Set()};
function commonTimes(){
  const c = {}; S.hours.forEach(h => h.slots && h.slots.split(",").forEach(t => c[t] = (c[t]||0)+1));
  const top = Object.keys(c).sort((a,b) => c[b]-c[a]).slice(0,8);
  return [...new Set([...top, ...H.extra, ...H.pick])].sort();
}
function renderHours(){
  const hm = {}; S.hours.forEach(h => hm[h.date] = h);
  const t = today();
  $("hlabel").textContent = mLabel(H.ms);
  $("hp").disabled = H.ms <= mStart(t);
  let g = WN.split("").map(c => `<div class="wh">${c}</div>`).join("") + "<div></div>".repeat(wd(H.ms));
  for (let d = 1; d <= mDays(H.ms); d++) {
    const ds = dayOf(H.ms,d), h = hm[ds];
    const n = h ? (h.slots ? h.slots.split(",").length : "休") : "";
    g += `<button class="c ${ds===t?"today":""} ${H.sel.has(ds)?"sel":""} ${dirty.has(ds)?"dy":""}" data-d="${ds}" ${ds<t?"disabled":""}><b>${d}</b><i>${n}</i></button>`;
  }
  $("hgrid").innerHTML = `<div class="grid">${g}</div>`;
  $("hed").hidden = !H.sel.size;
  $("hcount").textContent = `已選 ${H.sel.size} 天，請選擇時段`;
  $("hchips").innerHTML = commonTimes().map(x => `<button class="chip ${H.pick.has(x)?"on":""}" data-t="${x}">${x}</button>`).join("");
}
$("hp").onclick = () => { H.ms = addMonth(H.ms,-1); renderHours(); };
$("hn").onclick = () => { H.ms = addMonth(H.ms,1); renderHours(); };
$("hgrid").onclick = e => {
  const b = e.target.closest("button[data-d]"); if (!b) return;
  const ds = b.dataset.d;
  if (H.sel.has(ds)) H.sel.delete(ds); else H.sel.add(ds);
  if (H.sel.size === 1) {
    const h = S.hours.find(x => x.date === [...H.sel][0]);
    H.pick = new Set(h && h.slots ? h.slots.split(",") : []);
  }
  renderHours();
};
$("hsel").onclick = e => {
  const b = e.target.closest("button[data-s]"); if (!b) return;
  const k = b.dataset.s, t = today(); H.sel.clear();
  if (k !== "clear") for (let d = 1; d <= mDays(H.ms); d++) {
    const ds = dayOf(H.ms,d), w = wd(ds); if (ds < t) continue;
    if (k === "all" || (k === "wk" && w > 0 && w < 6) || (k === "we" && (w === 0 || w === 6))) H.sel.add(ds);
  }
  renderHours();
};
$("hchips").onclick = e => {
  const b = e.target.closest("button[data-t]"); if (!b) return;
  const t = b.dataset.t; if (H.pick.has(t)) H.pick.delete(t); else H.pick.add(t);
  renderHours();
};
$("hAdd").onclick = () => { const v = $("hT").value; if (!v) return toast("請先選一個時間"); H.extra.add(v); H.pick.add(v); renderHours(); };
function applyHours(list){
  const s = list.sort().join(","), n = H.sel.size;
  H.sel.forEach(ds => {
    dirty.set(ds, {date:ds, slots:s, note:null});
    const ex = S.hours.find(h => h.date === ds);
    if (ex) ex.slots = s; else S.hours.push({date:ds, slots:s, note:""});
  });
  H.sel.clear(); renderHours(); updBar(); toast(`已套用到 ${n} 天，記得按下方儲存`);
}
$("hApply").onclick = () => H.pick.size ? applyHours([...H.pick]) : toast("請先選時段，或按「設為休息」");
$("hOff").onclick = () => applyHours([]);

/* ================= 服務項目 ================= */
let SF = "all";
const SK = ["服務名稱","價格","課程分鐘","緩衝分鐘","狀態"];
const svcNorm = a => JSON.stringify(a.map(s => SK.map(k => String(s[k] ?? ""))));
function renderServices(){
  const h = svc.map((s,i) => {
    if ((SF === "on" && s["狀態"] !== "啟用") || (SF === "off" && s["狀態"] !== "停用")) return "";
    const f = (k,l) => `<label>${l}<input type="number" inputmode="numeric" data-i="${i}" data-k="${k}" value="${esc(s[k])}"></label>`;
    return `<div class="card">
      <input style="width:100%;font-weight:600" placeholder="服務名稱" data-i="${i}" data-k="服務名稱" value="${esc(s["服務名稱"])}">
      <div class="f3">${f("價格","價格")}${f("課程分鐘","課程分鐘")}${f("緩衝分鐘","緩衝分鐘")}</div>
      <div class="row sp"><select data-i="${i}" data-k="狀態"><option ${s["狀態"]==="啟用"?"selected":""}>啟用</option><option ${s["狀態"]==="停用"?"selected":""}>停用</option></select>
      <button class="b g sm d" data-del="${i}">刪除</button></div></div>`;
  }).join("");
  $("slist").innerHTML = h || '<p class="mute">沒有符合的服務。</p>';
}
$("slist").oninput = $("slist").onchange = e => {
  const el = e.target.closest("[data-i]"); if (!el) return;
  svc[+el.dataset.i][el.dataset.k] = el.value; updBar();
};
$("slist").onclick = e => {
  const b = e.target.closest("button[data-del]"); if (!b) return;
  const i = +b.dataset.del;
  if (!confirm(`確定刪除「${svc[i]["服務名稱"] || "未命名服務"}」？\n已經存在的預約紀錄不受影響。`)) return;
  svc.splice(i,1); renderServices(); updBar();
};
$("sf").onclick = e => {
  const b = e.target.closest("button[data-f]"); if (!b) return;
  SF = b.dataset.f;
  document.querySelectorAll("#sf .pill").forEach(x => x.classList.toggle("on", x === b));
  renderServices();
};
$("sAdd").onclick = () => { svc.push({"服務名稱":"","價格":"","課程分鐘":"","緩衝分鐘":"0","狀態":"啟用"}); SF = "all"; document.querySelectorAll("#sf .pill").forEach(x => x.classList.toggle("on", x.dataset.f === "all")); renderServices(); updBar(); window.scrollTo(0, document.body.scrollHeight); };

/* ================= 會員備註 ================= */
function renderMembers(){
  const q = $("mq").value.trim().toLowerCase();
  const list = S.members.filter(m => !q || (m["姓名"] + m["電話"]).toLowerCase().includes(q));
  $("mlist").innerHTML = list.length ? list.map(m => {
    const n = S.bookings.filter(b => b["電話"] === m["電話"] && b["狀態"] !== "已取消").length;
    return `<div class="card">
      <div class="row sp"><b>${esc(m["姓名"])}</b><span class="mute">預約 ${n} 次</span></div>
      <div class="mute"><a href="tel:${esc(fixPhone(m["電話"]))}">${esc(fixPhone(m["電話"]))}</a>　首次 ${esc(m["首次預約日期"])}</div>
      <textarea rows="2" data-r="${m._row}" placeholder="寫下備註，例如偏好、提醒事項…">${esc(m["備註"])}</textarea></div>`;
  }).join("") : '<p class="mute">沒有符合的會員。</p>';
}
$("mq").oninput = renderMembers;
$("mlist").onchange = async e => {
  const t = e.target.closest("textarea[data-r]"); if (!t) return;
  const m = S.members.find(x => String(x._row) === t.dataset.r), note = t.value;
  try { await api("saveMember", {row:m._row, name:m["姓名"], phone:m["電話"], note}); m["備註"] = note; toast("備註已儲存"); }
  catch(err) { toast(err.message); }
};

/* ================= 儲存列 ================= */
function updBar(){
  const bar = $("bar"), b = $("save");
  if (tab === "hours" && dirty.size) { bar.hidden = false; b.textContent = `儲存營業時間（${dirty.size} 天）`; }
  else if (tab === "services" && svcNorm(svc) !== svcNorm(S.services)) { bar.hidden = false; b.textContent = "儲存服務項目"; }
  else bar.hidden = true;
}
$("save").onclick = async () => {
  const b = $("save"); b.disabled = true;
  try {
    if (tab === "hours") {
      await api("saveHours", {rows:[...dirty.values()]}); dirty.clear();
    } else {
      if (!svc.length && !confirm("服務項目會全部清空，確定嗎？")) { b.disabled = false; return; }
      await api("saveServices", {list: svc.map(s => Object.fromEntries(SK.map(k => [k, s[k]])))});
    }
    await load(); toast("已儲存");
  } catch(e) { toast(e.message); }
  b.disabled = false; updBar();
};

function renderAll(){ renderBookings(); renderHours(); renderServices(); renderMembers(); updBar(); }
</script>
</body>
</html>
