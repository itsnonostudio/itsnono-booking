<!DOCTYPE html>
<html lang="zh-Hant">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#6FA991"
  >

  <title>ITSNONO_STUDIO｜線上預約</title>


  <style>

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;

      background:
        linear-gradient(
          180deg,
          #FFF8E9 0%,
          #FFF9EE 100%
        );

      color: #4C514D;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Noto Sans TC",
        "Microsoft JhengHei",
        sans-serif;

      -webkit-font-smoothing: antialiased;
    }


    /* =========================
       HEADER
    ========================= */

    .header {
      width: 100%;

      background:
        linear-gradient(
          135deg,
          #6FA991 0%,
          #629D85 100%
        );

      color: #FFFFFF;

      padding:
        max(28px, env(safe-area-inset-top))
        24px
        32px;

      position: relative;
      overflow: hidden;
    }

    .header::before {
      content: "";

      position: absolute;

      width: 180px;
      height: 180px;

      right: -70px;
      top: -90px;

      border-radius: 50%;

      background:
        rgba(255, 255, 255, 0.08);
    }

    .header::after {
      content: "";

      position: absolute;

      width: 120px;
      height: 120px;

      left: -70px;
      bottom: -80px;

      border-radius: 50%;

      background:
        rgba(255, 255, 255, 0.06);
    }

    .header-inner {
      position: relative;
      z-index: 2;

      width: 100%;
      max-width: 780px;

      margin: 0 auto;
    }

    .header-small {
      color: #FFF0CE;

      font-size: 12px;
      font-weight: 700;

      letter-spacing: 1.5px;
    }

    .header-title {
      margin-top: 7px;

      font-size:
        clamp(25px, 5vw, 32px);

      line-height: 1.25;

      font-weight: 800;

      letter-spacing: 1px;
    }

    .header-sub {
      margin-top: 7px;

      color: #EAF4EC;

      font-size: 12px;

      letter-spacing: 1.5px;
    }


    /* =========================
       CONTAINER
    ========================= */

    .container {
      width: 100%;
      max-width: 780px;

      margin: 0 auto;

      padding:
        24px 18px
        calc(40px + env(safe-area-inset-bottom));
    }


    /* =========================
       CARD
    ========================= */

    .booking-card {
      background: #FFFFFF;

      border:
        1px solid rgba(233, 201, 157, 0.75);

      border-radius: 18px;

      padding:
        22px 18px 24px;

      box-shadow:
        0 8px 30px
        rgba(63, 98, 87, 0.08);
    }


    .section-title {
      display: flex;

      align-items: center;

      gap: 10px;

      color: #3F6257;

      font-size: 20px;

      font-weight: 800;

      margin-bottom: 4px;
    }

    .section-title::before {
      content: "";

      width: 5px;
      height: 23px;

      border-radius: 10px;

      background: #F18782;
    }

    .section-description {
      margin:
        0 0 22px 15px;

      color: #8A8D87;

      font-size: 13px;

      line-height: 1.6;
    }


    /* =========================
       FORM
    ========================= */

    .form-group {
      margin-top: 20px;
    }

    .form-group:first-of-type {
      margin-top: 0;
    }

    label {
      display: block;

      margin-bottom: 8px;

      color: #71847B;

      font-size: 14px;

      font-weight: 600;
    }

    select,
    input {
      display: block;

      width: 100%;

      min-height: 48px;

      padding:
        12px 14px;

      border:
        1px solid #E9C99D;

      border-radius: 10px;

      background: #FFFFFF;

      font-family: inherit;

      font-size: 16px;

      color: #4C514D;

      outline: none;
    }

    select:focus,
    input:focus {
      border-color: #6FA991;

      background: #FBFFFC;

      box-shadow:
        0 0 0 3px
        rgba(111, 169, 145, 0.15);
    }

    input::placeholder {
      color: #B7BAB5;
    }


    /* =========================
       SELECT
    ========================= */

    select {
      appearance: none;
      -webkit-appearance: none;

      background-image:

        linear-gradient(
          45deg,
          transparent 50%,
          #6FA991 50%
        ),

        linear-gradient(
          135deg,
          #6FA991 50%,
          transparent 50%
        );

      background-position:

        calc(100% - 18px) 21px,
        calc(100% - 12px) 21px;

      background-size:
        6px 6px,
        6px 6px;

      background-repeat: no-repeat;

      padding-right: 40px;
    }


    /* =========================
       CALENDAR (自製可點選月曆)
    ========================= */

    .calendar {
      border: 1px solid #E9C99D;
      border-radius: 14px;
      padding: 14px;
      background: #FFFFFF;
    }

    .calendar-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .calendar-nav {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: none;
      background: #F1F8F3;
      color: #3F6257;
      font-size: 17px;
      line-height: 1;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .calendar-nav:disabled {
      opacity: .3;
      cursor: not-allowed;
    }

    .calendar-title {
      font-size: 16px;
      font-weight: 800;
      color: #3F6257;
    }

    .calendar-weekdays {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      text-align: center;
      color: #8A8D87;
      font-size: 12px;
      margin-bottom: 6px;
    }

    .calendar-days {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
    }

    .calendar-day {
      aspect-ratio: 1 / 1;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      font-size: 14px;
      font-family: inherit;
      color: #4C514D;
      background: transparent;
      border: none;
      cursor: pointer;
    }

    .calendar-day.empty {
      cursor: default;
    }

    .calendar-day.disabled {
      color: #D8DAD3;
      cursor: not-allowed;
    }

    .calendar-day.today {
      font-weight: 800;
      color: #6FA991;
    }

    .calendar-day.selected {
      background: #6FA991;
      color: #FFFFFF;
      font-weight: 800;
    }

    .calendar-day:not(.disabled):not(.empty):not(.selected):hover {
      background: #F1F8F3;
    }

    .selected-date-label {
      margin-top: 10px;
      font-size: 13px;
      color: #3F6257;
      text-align: center;
    }

    .selected-date-label strong {
      color: #F18782;
    }


    /* =========================
       TIME
    ========================= */

    .time-wrapper {
      margin-top: 20px;
    }

    .times {
      display: grid;

      grid-template-columns:
        repeat(3, minmax(0, 1fr));

      gap: 9px;
    }

    .time-button {
      width: 100%;

      min-height: 48px;

      border:
        1px solid #6FA991;

      background: #FFFFFF;

      color: #3F6257;

      border-radius: 10px;

      padding:
        11px 5px;

      font-family: inherit;

      font-size: 15px;

      font-weight: 600;

      cursor: pointer;
    }

    .time-button.selected {
      background: #6FA991;

      border-color: #6FA991;

      color: #FFFFFF;

      box-shadow:
        0 4px 10px
        rgba(111, 169, 145, 0.25);
    }

    .time-button.disabled,
    .time-button:disabled {
      background: #F5F4EF;

      border-color: #DCDCD5;

      color: #B7BAB5;

      cursor: not-allowed;

      box-shadow: none;
    }

    .no-time {
      grid-column: 1 / -1;

      padding:
        15px 10px;

      border-radius: 10px;

      background: #FAF8F2;

      color: #8A8D87;

      font-size: 14px;

      line-height: 1.6;

      text-align: center;
    }


    /* =========================
       SUBMIT
    ========================= */

    .submit {
      display: block;

      width: 100%;

      min-height: 52px;

      margin-top: 28px;

      padding:
        14px 18px;

      border: none;

      border-radius: 11px;

      background:
        linear-gradient(
          135deg,
          #F18782 0%,
          #E97D78 100%
        );

      color: #FFFFFF;

      font-family: inherit;

      font-size: 17px;

      font-weight: 800;

      letter-spacing: 1px;

      cursor: pointer;

      box-shadow:
        0 6px 15px
        rgba(241, 135, 130, 0.22);
    }

    .submit:disabled {
      opacity: .55;

      cursor: not-allowed;

      box-shadow: none;
    }


    /* =========================
       DEPOSIT PANEL（新客訂金）
    ========================= */

    .deposit-panel {
      margin-top: 24px;

      padding: 18px 16px 20px;

      border-radius: 14px;

      background: #FFFDF8;

      border: 1px solid #E9C99D;
    }

    .deposit-title {
      color: #3F6257;

      font-size: 17px;

      font-weight: 800;

      margin-bottom: 10px;
    }

    .deposit-rules {
      color: #71847B;

      font-size: 13px;

      line-height: 1.8;

      margin-bottom: 14px;
    }

    .deposit-account {
      padding: 12px 14px;

      border-radius: 10px;

      background: #F1F8F3;

      color: #3F6257;

      font-size: 14px;

      margin-bottom: 6px;

      text-align: center;
    }

    .deposit-account strong {
      color: #F18782;

      font-size: 16px;

      letter-spacing: 1px;
    }


    /* =========================
       MESSAGE
    ========================= */

    .message {
      margin-top: 18px;

      color: #3F6257;

      line-height: 1.8;

      font-size: 14px;
    }


    .success {
      padding:
        20px 18px;

      margin-top: 0;

      border-radius: 13px;

      background: #FFFDF8;

      border:
        1px solid #E9C99D;

      box-shadow:
        0 4px 14px
        rgba(76, 81, 77, 0.05);
    }

    .success-title {
      color: #3F6257;

      font-size: 20px;

      font-weight: 800;

      text-align: center;

      margin-bottom: 12px;
    }

    .reservation-id {
      display: block;

      width: 100%;

      color: #F18782;

      font-size: 18px;

      font-weight: 800;

      text-align: center;

      margin:
        5px 0 18px;
    }

    .success-info {
      padding: 14px;

      border-radius: 10px;

      background: #FFFFFF;

      border:
        1px solid #F0E5D4;
    }

    .success-row {
      padding: 8px 0;

      border-bottom:
        1px solid #F1ECE3;

      font-size: 14px;

      line-height: 1.6;
    }

    .success-row:last-child {
      border-bottom: none;
    }

    .success-label {
      color: #8A8D87;

      font-size: 12px;

      margin-bottom: 2px;
    }

    .success-value {
      color: #4C514D;

      font-weight: 600;
    }

    .success-notice {
      margin-top: 15px;

      padding: 12px;

      border-radius: 9px;

      background: #F1F8F3;

      color: #3F6257;

      text-align: center;

      font-size: 13px;

      line-height: 1.7;
    }


    /* =========================
       LINE STATUS
    ========================= */

    .line-status {
      margin-top: 13px;

      padding:
        0 5px;

      font-size: 12px;

      color: #71847B;

      text-align: center;

      line-height: 1.6;
    }

    .success-status {
      color: #3F6257;
    }

    .error-status {
      color: #D66F69;
    }


    /* =========================
       LOADING
    ========================= */

    .loading {
      display: inline-flex;

      align-items: center;

      justify-content: center;

      gap: 7px;
    }

    .loading-dot {
      width: 6px;
      height: 6px;

      border-radius: 50%;

      background: #6FA991;

      animation:
        loading 1s infinite ease-in-out;
    }

    .loading-dot:nth-child(2) {
      animation-delay: .15s;
    }

    .loading-dot:nth-child(3) {
      animation-delay: .3s;
    }

    @keyframes loading {

      0%,
      60%,
      100% {
        opacity: .3;
        transform: translateY(0);
      }

      30% {
        opacity: 1;
        transform: translateY(-3px);
      }

    }


    @media (min-width: 600px) {

      .header {
        padding:
          36px 32px;
      }

      .container {
        padding:
          34px 24px 50px;
      }

      .booking-card {
        padding:
          30px;
      }

      .times {
        grid-template-columns:
          repeat(4, minmax(0, 1fr));

        gap: 10px;
      }

    }


    @media (min-width: 900px) {

      .header {
        padding:
          38px 30px;
      }

      .container {
        padding:
          45px 30px 70px;
      }

      .booking-card {
        padding:
          34px;

        border-radius: 20px;
      }

      .section-title {
        font-size: 22px;
      }

      .times {
        grid-template-columns:
          repeat(4, minmax(0, 1fr));

        gap: 11px;
      }

      .submit {
        min-height: 56px;

        font-size: 18px;
      }

    }


    @media (max-width: 359px) {

      .header {
        padding-left: 18px;
        padding-right: 18px;
      }

      .container {
        padding:
          18px 12px 35px;
      }

      .booking-card {
        padding:
          18px 14px 20px;

        border-radius: 15px;
      }

      .section-title {
        font-size: 18px;
      }

      .times {
        gap: 7px;
      }

      .time-button {
        min-height: 45px;

        font-size: 14px;
      }

    }

  </style>

</head>


<body>


<header class="header">

  <div class="header-inner">

    <div class="header-small">
      ITSNONO_STUDIO
    </div>

    <div class="header-title">
      線上預約
    </div>

    <div class="header-sub">
      ONLINE RESERVATION
    </div>

  </div>

</header>


<main class="container">

  <section class="booking-card">

    <div class="section-title">
      預約服務
    </div>

    <div class="section-description">
      請選擇服務、日期與方便的時間，我們會為您保留預約。首次預約需支付訂金 $500。
    </div>


    <div class="form-group">

      <label for="service">
        選擇服務
      </label>

      <select id="service">

        <option
          value="三段深層淨膚課程"
          data-price="2500"
        >
          三段深層淨膚課程｜$2,500
        </option>

      </select>

    </div>


    <div class="form-group">

      <label>
        選擇日期
      </label>

      <div
        id="calendar"
        class="calendar"
      ></div>

      <div
        id="selectedDateLabel"
        class="selected-date-label"
      >
        請點選日期
      </div>

    </div>


    <div class="time-wrapper">

      <label>
        選擇時間
      </label>

      <div
        id="times"
        class="times"
      >

        <div class="no-time">
          請先選擇日期
        </div>

      </div>

    </div>


    <div class="form-group">

      <label for="name">
        姓名
      </label>

      <input
        type="text"
        id="name"
        placeholder="請輸入姓名"
        autocomplete="name"
      >

    </div>


    <div class="form-group">

      <label for="phone">
        電話
      </label>

      <input
        type="tel"
        id="phone"
        placeholder="請輸入聯絡電話"
        autocomplete="tel"
        inputmode="tel"
      >

    </div>


    <button
      id="submitButton"
      class="submit"
      type="button"
    >
      確認預約
    </button>


    <!--
      新客訂金說明區塊，預設隱藏。
      只有在「確認預約」時查不到會員資料，才會顯示出來。
    -->

    <div
      id="depositPanel"
      class="deposit-panel"
      style="display:none;"
    >

      <div class="deposit-title">
        新客戶訂金說明
      </div>

      <div class="deposit-rules">
        ・首次預約需先支付訂金 $500，並於課程當天折抵課程費用。<br>
        ・請匯款至下方帳號，並填寫匯款帳號後五碼，我們確認匯款後即完成正式預約。<br>
        ・匯款確認前，此預約狀態將顯示為「待確認」。
      </div>

      <div class="deposit-account">
        匯款帳號：<strong>XXXX-XXXX-XXXX-XXXX</strong>
      </div>

      <div class="form-group">

        <label for="depositLast5">
          匯款帳號後五碼
        </label>

        <input
          type="text"
          id="depositLast5"
          placeholder="請輸入匯款帳號後五碼"
          inputmode="numeric"
          maxlength="5"
        >

      </div>

      <button
        id="depositConfirmButton"
        class="submit"
        type="button"
      >
        確認訂金並完成預約
      </button>

    </div>


    <div
      id="message"
      class="message"
    ></div>


    <div
      id="lineStatus"
      class="line-status"
    >
      LINE 初始化中...
    </div>

  </section>

</main>


<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

<script src="config.js"></script>

<script>

  /* ==================================================
     設定值改放 config.js（同一個 repo 底下），
     這支只讀 CONFIG.LIFF_ID / CONFIG.GAS_ENDPOINT，
     之後要換 LIFF App 或重新部署 GAS，
     只需要改 config.js，不用動這支主要邏輯檔案。
  ================================================== */

  let selectedTime = '';

  let selectedDate = '';

  let calendarViewDate = new Date();

  let monthAvailability = {};

  let monthAvailabilityKey = '';

  let monthAvailabilityFailed = false;

  // lineUserId 僅用於畫面顯示，不會傳給後端當作身分依據
  let lineUserId = '';

  // idToken 才是後端會拿去跟 LINE 官方驗證身分的依據，
  // 需要 LIFF App 的 Scope 有勾選 openid 才拿得到值
  let lineIdToken = '';

  let liffReady = false;

  // 暫存「還沒送出」的預約資料，等使用者填完訂金後五碼再一起送出
  let pendingReservationData = null;


  /* ==================================================
     初始化
  ================================================== */

  window.addEventListener(
    'load',
    function () {

      renderCalendar();

      initLIFF();

    }
  );


  /* ==================================================
     按鈕事件
  ================================================== */

  document
    .getElementById('submitButton')
    .addEventListener(
      'click',
      submitReservation
    );


  document
    .getElementById('depositConfirmButton')
    .addEventListener(
      'click',
      confirmDepositAndSubmit
    );


  /* ==================================================
     月曆
  ================================================== */

  function pad2(n) {

    return String(n).padStart(2, '0');

  }


  function toDateStr(year, month, day) {

    return (
      year +
      '-' +
      pad2(month + 1) +
      '-' +
      pad2(day)
    );

  }


  function toYearMonthStr(year, month) {

    return (
      year +
      '-' +
      pad2(month + 1)
    );

  }


  async function ensureMonthAvailability(year, month) {

    const key =
      toYearMonthStr(year, month);


    if (key === monthAvailabilityKey) {

      return;

    }


    try {

      const result =
        await callGAS(
          'getAvailableDatesInMonth',
          {
            yearMonth:
              key
          }
        );


      if (
        result &&
        result.success
      ) {

        monthAvailability =
          result.dates || {};

        monthAvailabilityFailed =
          false;

      } else {

        monthAvailability = {};

        monthAvailabilityFailed =
          true;

      }


    } catch (error) {

      console.error(
        'ensureMonthAvailability ERROR:',
        error
      );


      monthAvailability = {};

      monthAvailabilityFailed =
        true;

    }


    monthAvailabilityKey =
      key;

  }


  async function renderCalendar() {

    const container =
      document.getElementById('calendar');


    const year =
      calendarViewDate.getFullYear();

    const month =
      calendarViewDate.getMonth();


    if (
      toYearMonthStr(year, month) !== monthAvailabilityKey
    ) {

      container.innerHTML =

        '<div class="no-time">' +

          '<span class="loading">' +

            '<span class="loading-dot"></span>' +

            '<span class="loading-dot"></span>' +

            '<span class="loading-dot"></span>' +

            '讀取可預約日期' +

          '</span>' +

        '</div>';

    }


    await ensureMonthAvailability(
      year,
      month
    );


    renderCalendarGrid();

  }


  function renderCalendarGrid() {

    const container =
      document.getElementById('calendar');


    const year =
      calendarViewDate.getFullYear();

    const month =
      calendarViewDate.getMonth();


    const today =
      new Date();

    today.setHours(0, 0, 0, 0);


    const firstDay =
      new Date(year, month, 1);

    const startWeekday =
      firstDay.getDay();

    const daysInMonth =
      new Date(year, month + 1, 0).getDate();


    const isPastMonth =

      year < today.getFullYear() ||

      (
        year === today.getFullYear() &&
        month < today.getMonth()
      );


    let html = '';


    html +=
      '<div class="calendar-header">' +

        '<button type="button" class="calendar-nav" id="prevMonth"' +
          (isPastMonth ? ' disabled' : '') +
        '>&#8249;</button>' +

        '<div class="calendar-title">' +
          year + '年' + (month + 1) + '月' +
        '</div>' +

        '<button type="button" class="calendar-nav" id="nextMonth">' +
          '&#8250;' +
        '</button>' +

      '</div>';


    html +=
      '<div class="calendar-weekdays">';

    ['日', '一', '二', '三', '四', '五', '六'].forEach(
      function (w) {

        html +=
          '<div>' + w + '</div>';

      }
    );

    html += '</div>';


    html +=
      '<div class="calendar-days">';


    for (let i = 0; i < startWeekday; i++) {

      html +=
        '<div class="calendar-day empty"></div>';

    }


    for (let d = 1; d <= daysInMonth; d++) {

      const dateObj =
        new Date(year, month, d);

      dateObj.setHours(0, 0, 0, 0);


      const dateStr =
        toDateStr(year, month, d);


      const isPast =
        dateObj < today;

      const isToday =
        dateObj.getTime() === today.getTime();

      const isSelected =
        dateStr === selectedDate;


      const hasAvailability =
        Object.prototype.hasOwnProperty.call(
          monthAvailability,
          dateStr
        )
          ? monthAvailability[dateStr]
          : false;

      const isUnavailable =
        monthAvailabilityFailed
          ? false
          : !hasAvailability;


      const isDisabled =
        isPast || isUnavailable;


      let cls =
        'calendar-day';

      if (isDisabled) cls += ' disabled';

      if (isToday) cls += ' today';

      if (isSelected) cls += ' selected';


      html +=

        '<button type="button" class="' +
          cls +
        '" data-date="' +
          dateStr +
        '"' +
        (isDisabled ? ' disabled' : '') +
        '>' +
          d +
        '</button>';

    }


    html += '</div>';


    container.innerHTML =
      html;


    document
      .getElementById('prevMonth')
      .addEventListener(
        'click',
        function () {

          calendarViewDate.setMonth(
            calendarViewDate.getMonth() - 1
          );

          renderCalendar();

        }
      );


    document
      .getElementById('nextMonth')
      .addEventListener(
        'click',
        function () {

          calendarViewDate.setMonth(
            calendarViewDate.getMonth() + 1
          );

          renderCalendar();

        }
      );


    container
      .querySelectorAll(
        '.calendar-day:not(.empty):not(.disabled)'
      )
      .forEach(
        function (btn) {

          btn.addEventListener(
            'click',
            function () {

              selectedDate =
                btn.dataset.date;

              renderCalendarGrid();

              updateSelectedDateLabel();

              loadTimes();

            }
          );

        }
      );

  }


  function updateSelectedDateLabel() {

    const label =
      document.getElementById(
        'selectedDateLabel'
      );

    if (!selectedDate) {

      label.innerHTML =
        '請點選日期';

      return;

    }

    label.innerHTML =
      '已選擇日期：<strong>' +
      selectedDate +
      '</strong>';

  }


  /* ==================================================
     LIFF
     注意：LIFF App 的 Scope 除了 profile，
     還要多勾選 openid，liff.getIDToken() 才拿得到值。
     若 idToken 一直是空的，先去 LINE Developers Console
     檢查這個 LIFF App 的 Scope 設定。
  ================================================== */

  async function initLIFF() {

    const status =
      document.getElementById(
        'lineStatus'
      );

    try {

      status.innerText =
        'LINE 初始化中...';


      await liff.init({

        liffId:
          CONFIG.LIFF_ID

      });


      console.log(
        'LIFF 初始化成功'
      );


      if (
        !liff.isLoggedIn()
      ) {

        status.innerText =
          'LINE 登入中...';


        liff.login({

          redirectUri:
            window.location.href

        });


        return;

      }


      const profile =
        await liff.getProfile();


      console.log(
        'LINE PROFILE:',
        profile
      );


      if (
        !profile ||
        !profile.userId
      ) {

        throw new Error(
          '無法取得 LINE User ID'
        );

      }


      lineUserId =
        profile.userId;


      lineIdToken =
        liff.getIDToken();


      if (!lineIdToken) {

        console.warn(
          '拿不到 idToken，請確認 LIFF App 的 Scope 是否有勾選 openid'
        );

      }


      liffReady =
        true;


      status.innerText =
        '✓ LINE 已連線';


      status.classList.add(
        'success-status'
      );


    } catch (error) {

      console.error(
        'LIFF ERROR:',
        error
      );


      status.innerText =
        'LINE 初始化失敗';


      status.classList.add(
        'error-status'
      );


      document
        .getElementById('message')
        .innerHTML =

          '<div class="success">' +

            '<div class="success-title">' +
              'LINE 連線異常' +
            '</div>' +

            '<div class="success-notice">' +

              escapeHtml(
                error.message ||
                String(error)
              ) +

            '</div>' +

          '</div>';

    }

  }


  /* ==================================================
     呼叫 GAS API
  ================================================== */

  async function callGAS(action, data) {

    const response =
      await fetch(
        CONFIG.GAS_ENDPOINT,
        {

          method: 'POST',

          headers: {

            'Content-Type':
              'text/plain;charset=utf-8'

          },

          body:
            JSON.stringify({

              action:
                action,

              data:
                data || {}

            })

        }
      );


    if (!response.ok) {

      throw new Error(
        'GAS API HTTP ' +
        response.status
      );

    }


    const text =
      await response.text();


    let result;


    try {

      result =
        JSON.parse(text);

    } catch (error) {

      console.error(
        'GAS 回傳內容:',
        text
      );

      throw new Error(
        'GAS 回傳不是有效 JSON'
      );

    }


    return result;

  }


  /* ==================================================
     取得可預約時間
  ================================================== */

  async function loadTimes() {

    selectedTime =
      '';


    const date =
      selectedDate;


    const container =
      document
        .getElementById('times');


    if (!date) {

      container.innerHTML =

        '<div class="no-time">' +
          '請先選擇日期' +
        '</div>';

      return;

    }


    container.innerHTML =

      '<div class="no-time">' +

        '<span class="loading">' +

          '<span class="loading-dot"></span>' +

          '<span class="loading-dot"></span>' +

          '<span class="loading-dot"></span>' +

          '讀取可預約時段' +

        '</span>' +

      '</div>';


    try {

      const result =
        await callGAS(
          'getAvailableTimes',
          {
            date:
              date
          }
        );


      if (
        !result ||
        !result.success
      ) {

        throw new Error(
          result &&
          result.message
            ? result.message
            : '讀取時段失敗'
        );

      }


      const times =
        result.times || [];


      container.innerHTML =
        '';


      if (
        times.length === 0
      ) {

        container.innerHTML =

          '<div class="no-time">' +
            '這天沒有可預約時段' +
          '</div>';

        return;

      }


      times.forEach(
        function(entry) {

          const time =
            typeof entry === 'string'
              ? entry
              : entry.time;


          const backendAvailable =
            typeof entry === 'string'
              ? true
              : (entry.available !== false);


          const isPast =
            isTimeInPast(date, time);


          const isDisabled =
            !backendAvailable ||
            isPast;


          const button =
            document.createElement(
              'button'
            );


          button.type =
            'button';


          button.className =
            'time-button' +
            (isDisabled ? ' disabled' : '');


          button.innerText = formatTime(time);


          if (isDisabled) {

            button.disabled =
              true;

          } else {

            button.addEventListener(
              'click',
              function() {

                selectedTime =
                  time;


                document
                  .querySelectorAll(
                    '.time-button'
                  )
                  .forEach(
                    function(btn) {

                      btn.classList.remove(
                        'selected'
                      );

                    }
                  );


                button.classList.add(
                  'selected'
                );

              }
            );

          }


          container.appendChild(
            button
          );

        }
      );


    } catch (error) {

      console.error(
        'loadTimes ERROR:',
        error
      );


      container.innerHTML =

        '<div class="no-time">' +
          '讀取失敗：' +
          escapeHtml(
            error.message
          ) +
        '</div>';

    }

  }

  function formatTime(value) {

    if (!value) {
      return '';
    }

    const text = String(value).trim();

    const match = text.match(/(\d{1,2}):(\d{2})/);

    if (match) {
      return (
        String(Number(match[1])).padStart(2, '0') +
        ':' +
        match[2]
      );
    }

    return text;
  }


  function isTimeInPast(dateStr, timeStr) {

    if (!dateStr || !timeStr) {
      return false;
    }


    const now =
      new Date();


    const todayStr =
      toDateStr(
        now.getFullYear(),
        now.getMonth(),
        now.getDate()
      );


    if (dateStr !== todayStr) {
      return false;
    }


    const match =
      String(timeStr).match(/(\d{1,2}):(\d{2})/);

    if (!match) {
      return false;
    }


    const slotHour =
      Number(match[1]);

    const slotMinute =
      Number(match[2]);


    const slotDate =
      new Date(
        now.getFullYear(),
        now.getMonth(),
        now.getDate(),
        slotHour,
        slotMinute
      );


    return slotDate <= now;

  }


  /* ==================================================
     步驟一：確認預約
     - 先檢查基本欄位
     - 呼叫後端確認是否為會員
     - 會員 -> 直接建立預約
     - 非會員 -> 顯示新客訂金說明，等待填寫後五碼
  ================================================== */

  async function submitReservation() {

    const date =
      selectedDate;


    const name =
      document
        .getElementById('name')
        .value
        .trim();


    const phone =
      document
        .getElementById('phone')
        .value
        .trim();


    const serviceElement =
      document.getElementById(
        'service'
      );


    const service =
      serviceElement.value;


    const price =
      serviceElement
        .selectedOptions[0]
        .dataset.price;


    const button =
      document.getElementById(
        'submitButton'
      );


    const message =
      document.getElementById(
        'message'
      );


    if (
      !liffReady ||
      !lineUserId
    ) {

      alert(
        'LINE 尚未連線，請從 LINE 官方帳號開啟預約。'
      );

      return;

    }


    if (!date) {

      alert(
        '請選擇日期'
      );

      return;

    }


    if (!selectedTime) {

      alert(
        '請選擇時間'
      );

      return;

    }


    if (!name) {

      alert(
        '請輸入姓名'
      );

      return;

    }


    if (!phone) {

      alert(
        '請輸入電話'
      );

      return;

    }


    // 每次重新確認流程時，先隱藏訂金區塊
    document
      .getElementById('depositPanel')
      .style.display =
        'none';


    message.innerHTML =
      '';


    button.disabled =
      true;


    button.innerText =
      '確認會員資料中...';


    const reservationData = {

      date:
        date,

      time:
        selectedTime,

      service:
        service,

      price:
        price,

      name:
        name,

      phone:
        phone,

      // 不再傳未經驗證的 lineUserId，改傳 idToken，
      // 後端會用這個向 LINE 官方換回「真正、無法偽造」的 userId
      idToken:
        lineIdToken

    };


    try {

      const memberResult =
        await callGAS(
          'checkMember',
          {
            phone:
              phone
          }
        );


      if (
        !memberResult ||
        !memberResult.success
      ) {

        throw new Error(
          '會員資料確認失敗，請稍後再試。'
        );

      }


      if (memberResult.isMember) {

        // 舊會員，直接建立正式預約
        await doCreateReservation(
          reservationData,
          false,
          ''
        );

      } else {

        // 新客，暫存資料並顯示訂金說明
        pendingReservationData =
          reservationData;


        const depositPanel =
          document.getElementById(
            'depositPanel'
          );


        depositPanel.style.display =
          'block';


        depositPanel.scrollIntoView({

          behavior:
            'smooth',

          block:
            'center'

        });

      }


    } catch (error) {

      console.error(
        'submitReservation ERROR:',
        error
      );


      alert(
        '系統發生錯誤：' +
        error.message
      );

    }


    button.disabled =
      false;


    button.innerText =
      '確認預約';

  }


  /* ==================================================
     步驟二（僅新客）：確認訂金並送出預約
  ================================================== */

  async function confirmDepositAndSubmit() {

    if (!pendingReservationData) {

      alert(
        '請先填寫預約資訊並按下「確認預約」。'
      );

      return;

    }


    const last5 =
      document
        .getElementById('depositLast5')
        .value
        .trim();


    if (
      !/^\d{5}$/.test(last5)
    ) {

      alert(
        '請輸入正確的匯款帳號後五碼（5 位數字）'
      );

      return;

    }


    const button =
      document.getElementById(
        'depositConfirmButton'
      );


    button.disabled =
      true;


    button.innerText =
      '處理中...';


    await doCreateReservation(
      pendingReservationData,
      true,
      last5
    );


    button.disabled =
      false;


    button.innerText =
      '確認訂金並完成預約';

  }


  /* ==================================================
     實際呼叫後端建立預約
  ================================================== */

  async function doCreateReservation(data, isNewCustomer, depositLast5) {

    try {

      const payload =
        Object.assign(
          {},
          data,
          {

            isNewCustomer:
              isNewCustomer,

            depositLast5:
              depositLast5

          }
        );


      const result =
        await callGAS(
          'createReservation',
          payload
        );


      if (
        result &&
        result.success
      ) {

        // 用免費的 liff.sendMessages() 把確認訊息送進聊天室，
        // 不會計入 Messaging API 的 Push 額度。
        // 需要 LIFF App 的 Scope 有勾選 chat_message.write，
        // 且必須是從 LINE 內的聊天室情境開啟才會成功，
        // 失敗也不影響預約已經成立這件事，所以只記錄不擋流程。
        if (
          result.notificationMessage &&
          liff.isInClient()
        ) {

          try {

            await liff.sendMessages(
              [ result.notificationMessage ]
            );

          } catch (sendError) {

            console.warn(
              'sendMessages 失敗（不影響預約結果）:',
              sendError
            );

          }

        }


        renderSuccessMessage(
          result
        );


        resetForm();


      } else {

        alert(

          result &&
          result.message

            ? result.message

            : '預約失敗，請稍後再試。'

        );


        loadTimes();

      }


    } catch (error) {

      console.error(
        'createReservation ERROR:',
        error
      );


      alert(
        '系統發生錯誤：' +
        error.message
      );

    }

  }


  /* ==================================================
     顯示預約成功／待確認訊息
  ================================================== */

  function renderSuccessMessage(result) {

    const message =
      document.getElementById(
        'message'
      );


    const isPending =
      result.status === '待確認';


    message.innerHTML =

      '<div class="success">' +

        '<div class="success-title">' +
          (
            isPending
              ? '📋 預約待確認'
              : '🎉 預約成功！'
          ) +
        '</div>' +

        '<div class="reservation-id">' +
          escapeHtml(result.reservationId || '') +
        '</div>' +

        '<div class="success-info">' +

          successRow(
            '日期',
            result.date || ''
          ) +

          successRow(
            '時間',
            formatTime(result.time)
          ) +

          successRow(
            '服務',
            result.service || ''
          ) +

          successRow(
            '價格',
            '$' + (result.price || '')
          ) +

          (
            isPending
              ? successRow(
                  '訂金後五碼',
                  result.depositLast5 || ''
                )
              : ''
          ) +

        '</div>' +

        '<div class="success-notice">' +

          (
            isPending
              ? '已收到您的訂金資訊，我們將盡快為您確認匯款，確認後將以 LINE 通知您正式預約成功。'
              : '預約確認通知已傳送至您的 LINE。'
          ) +

        '</div>' +

      '</div>';


    document
      .getElementById('depositPanel')
      .style.display =
        'none';


    document
      .getElementById('depositLast5')
      .value =
        '';


    pendingReservationData =
      null;


    message.scrollIntoView({

      behavior:
        'smooth',

      block:
        'center'

    });

  }


  /* ==================================================
     重置表單
  ================================================== */

  function resetForm() {

    selectedTime =
      '';


    selectedDate =
      '';


    calendarViewDate =
      new Date();


    // 剛完成的預約可能讓當天額滿，強制重新查詢這個月
    monthAvailabilityKey =
      '';


    renderCalendar();


    updateSelectedDateLabel();


    document
      .getElementById('times')
      .innerHTML =

        '<div class="no-time">' +
          '請先選擇日期' +
        '</div>';


    document
      .getElementById('name')
      .value =
      '';


    document
      .getElementById('phone')
      .value =
      '';

  }


  /* ==================================================
     成功資料列
  ================================================== */

  function successRow(label, value) {

    return (
      '<div class="success-row">' +

        '<div class="success-label">' +
          escapeHtml(label) +
        '</div>' +

        '<div class="success-value">' +
          escapeHtml(value) +
        '</div>' +

      '</div>'
    );

  }


  /* ==================================================
     HTML Escape
  ================================================== */

  function escapeHtml(value) {

    return String(value)

      .replace(
        /&/g,
        '&amp;'
      )

      .replace(
        /</g,
        '&lt;'
      )

      .replace(
        />/g,
        '&gt;'
      )

      .replace(
        /"/g,
        '&quot;'
      )

      .replace(
        /'/g,
        '&#039;'
      );

  }

</script>
